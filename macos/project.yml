name: DayView
options:
  bundleIdPrefix: fr.dayview
  deploymentTarget:
    macOS: "15.0"
packages:
  DayViewKit:
    path: Packages/DayViewKit
  DayPlanKit:
    path: Packages/DayPlanKit
targets:
  DayView:
    type: application
    platform: macOS
    sources:
      - path: DayView
      # Same app icon as the shared (Compose/JVM) macOS build.
      - path: ../artwork/dayview.icns
        buildPhase: resources
    info:
      path: DayView/Info.plist
      properties:
        CFBundleIconFile: dayview
    dependencies:
      - package: DayViewKit
        product: DayViewKit
      - package: DayPlanKit
        product: DayPlanKit
      - package: DayPlanKit
        product: DayPlanStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.dayview.app
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: DayView subtracts the time of your busy calendar events from the remaining day.
      configs:
        # Debug (native dev) build uses a distinct id so it can coexist with the shipping
        # fr.dayview.app (Compose) without confusing LaunchServices/TCC or `open -a DayView`.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: fr.dayview.app.debug
        # Release is signed with the hardened runtime and the calendar entitlement. The identity
        # is passed at build time (CODE_SIGN_IDENTITY), never stored here. Not sandboxed.
        Release:
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_ENTITLEMENTS: DayView/DayView.entitlements
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: --timestamp
          # Keep Xcode from injecting get-task-allow, which notarization rejects.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
